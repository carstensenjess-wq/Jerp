<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef2ff, #fef9f5);
        color: #1f2937;
      }

      .card {
        width: min(420px, 90vw);
        background: #ffffff;
        padding: 2.5rem;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        display: grid;
        gap: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.9rem;
      }

      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.5;
      }

      label {
        font-weight: 600;
        font-size: 0.95rem;
        display: block;
        margin-bottom: 0.4rem;
      }

      input {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border-radius: 12px;
        border: 1px solid #d1d5db;
        font-size: 1rem;
        box-sizing: border-box;
      }

      input:focus {
        outline: 2px solid #818cf8;
        border-color: transparent;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
      }

      button {
        padding: 0.75rem 1.4rem;
        border-radius: 999px;
        border: none;
        background: #4f46e5;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 18px rgba(79, 70, 229, 0.25);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Welcome back</h1>
        <p>Please sign in with your username and password.</p>
      </header>
      <form>
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter your username" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" />
        </div>
      </form>
      <div class="actions">
        <button type="button">Continue</button>
      </div>
    </main>
  </body>
</html>
